[package]
name = "ikigai-throttle"
description = "Reliability interception overlays for ikigai: RateLimit (per-prefix rate), Retry (re-issue transient idempotent failures), CircuitBreaker (trip open on a failing dependency), Failover (try [primary, backup, ...] on transient failure), Timeout (bound an invocation, transient on elapse), Throttle (cap concurrency, park the excess); logging & load-balancing later."
version = "0.1.11"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-throttle"

[dependencies]
# Native crate: it keeps a sliding window of Instants, so no wasm face (a wasm
# throttle would inject a Clock — a later refinement). Wraps ANY Space.
ikigai-core = "0.1.78" # Space::topology + Space::id (every single-space
                      # overlay forwards both, ledger #978);
                      # Resolution::map_endpoint (an overlay must forward
                      # what the inner resolution reported, not rebuild it);
                      # Error::is_transient (Retry gates on it);
                      # Invocation::with_bindings (each Failover candidate is
                      # invoked on the captures ITS OWN grammar took)
# Retry's RetryEndpoint implements the async Endpoint trait directly.
async-trait = "0.1"
# Timeout races the invoke against a timer: `select` (futures) + a runtime-agnostic
# timer (futures-timer works under the kernel's `block_on`, no tokio).
futures = "0.3"
futures-timer = "3"
# Throttle parks the excess on a fair async Semaphore (runtime-agnostic).
async-lock = "3"

[dev-dependencies]
# The module recipe as one test (`tests/conformance.rs`). This crate binds no
# endpoint of its own — an overlay decorates whatever it wraps — so the suite
# walks a conforming fixture space through every overlay and the whole stack and
# holds each report to the bare fixture's: identical contract, identical
# cacheability, the wrapped endpoint's typed errors unchanged. 0.6.0 adds
# SPACE-NAME (ledger #987): every overlay constructor is declared host-named, since
# an overlay wraps a space it was handed and claims no name of its own.
# ⚠ `"0.6.0"` is `>=0.6.0, <0.7.0` under Cargo's 0.x rules: raise it when 0.7 ships.
# 0.6.0 pulls ikigai-core 0.1.89 into every test build; `[dependencies]` above
# deliberately stays at the LIBRARY's true minimum (0.1.78), which the caret admits.
ikigai-conformance = "0.6.0"

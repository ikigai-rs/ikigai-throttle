[package]
name = "ikigai-throttle"
description = "Reliability interception overlays for ikigai: RateLimit (per-prefix rate), Retry (re-issue idempotent failures by their failure class, from the run's shared budget), CircuitBreaker (trip open on a failing dependency), Failover (try [primary, backup, ...] on a transient or retry-after failure), Timeout (bound an invocation, transient on elapse), Throttle (cap concurrency, park the excess); logging & load-balancing later."
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-throttle"

[dependencies]
# Wraps ANY Space. Builds for wasm32-unknown-unknown (CI's `wasm32 lib clippy`):
# RateLimit and CircuitBreaker read time from a core Clock (`with_clock`; on wasm32
# the host must install one, ledger #1507) and never from the platform. Timeout is
# native only, see below. Clock and Time are far older than the floor.
# 0.1.108 is the floor (ledger #1546, #200): Error::class + FailureClass (every
# re-issuing overlay decides from the class it RECEIVED), Error::RetryAfter (what
# RateLimit and an open CircuitBreaker answer), Verb::is_idempotent, and the run's
# shared retry pool and deadline (Invocation::retry_budget, RetryBudget::try_spend,
# Invocation::time_left). Older, still used: Space::topology + Space::id (ledger
# #978), Resolution::map_endpoint, Invocation::with_bindings (each Failover
# candidate is invoked on the captures ITS OWN grammar took).
# ⚠ Under 0.x caret rules "0.1.108" is >=0.1.108, <0.2.0.
ikigai-core = "0.1.108"
# Retry's RetryEndpoint implements the async Endpoint trait directly.
async-trait = "0.1"
# Throttle parks the excess on a fair async Semaphore (runtime-agnostic).
async-lock = "3"

# Timeout races the invoke against a timer: `select` (futures) + a runtime-agnostic
# timer (futures-timer works under the kernel's `block_on`, no tokio). NATIVE ONLY:
# futures-timer's native backend reads `Instant::now()` and runs a helper thread,
# which compile on wasm32 and fail there at runtime, so Timeout and both crates are
# left out of a wasm32 build
# (src/timeout.rs says what a wasm Timeout would need).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = "0.3"
futures-timer = "3"

[dev-dependencies]
# The module recipe as one test (`tests/conformance.rs`). This crate binds no
# endpoint of its own — an overlay decorates whatever it wraps — so the suite
# walks a conforming fixture space through every overlay and the whole stack and
# holds each report to the bare fixture's: identical contract, identical
# cacheability, the wrapped endpoint's typed errors unchanged. 0.6.0 adds
# SPACE-NAME (ledger #987): every overlay constructor is declared host-named, since
# an overlay wraps a space it was handed and claims no name of its own. 0.7.0 adds
# VALIDATE; 0.8.0 adds REQUIRED (a dropped required input must be refused typed),
# walked here on the mutating `Sink` too, so every overlay is held to passing the
# wrapped endpoint's `MissingArgument` through unchanged. 0.8.4 adds RESOLVES
# (ledger #338): a failed minimal resolution is reported once per action under
# RESOLVES rather than under the check that needed it, which the over-budget test
# pins, so 0.8.4 is the true floor.
# 0.9.0 adds core 0.1.105's contract-shape checks (REQUIRED probes input groups,
# OUTPUTS honors output_from, PIPELINE's named-only line, VALIDATE refuses a default
# on a binding) and RECOMPUTE; 0.10.0 adds FAILURES, OFF unless a suite opts in
# (`Suite::check_failures()`, not turned on here).
# ⚠ `"0.10.0"` is `>=0.10.0, <0.11.0` under Cargo's 0.x rules: raise it when 0.11 ships.
# Conformance's own floor is ikigai-core 0.1.108, which `[dependencies]` above already
# states as the library's true minimum, so tests build against it.
ikigai-conformance = "0.10.0"
